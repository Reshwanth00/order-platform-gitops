apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-platform-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/order-platform-gitops.git
    targetRevision: main
    path: overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: order-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
