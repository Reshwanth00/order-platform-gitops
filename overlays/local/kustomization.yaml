apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-platform
resources:
  - ../../base
images:
  - name: order-service
    newName: YOUR_DOCKERHUB_USER/order-service
    newTag: "1"
  - name: catalog-service
    newName: YOUR_DOCKERHUB_USER/catalog-service
    newTag: "1"
  - name: order-platform-ui
    newName: YOUR_DOCKERHUB_USER/order-platform-ui
    newTag: "1"
