apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: catalog-service
          image: catalog-service:latest
          ports: [{ name: http, containerPort: 8082 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8082 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8082 }, initialDelaySeconds: 30, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector: { app: catalog-service }
  ports: [{ name: http, port: 8082, targetPort: 8082 }]
